# Netlify build settings
[build]
  # Agar tumhare site ka root folder me index.html hai
  publish = "."

# Set proper Content-Type for sitemap.xml
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

# Optional: Agar future me koi aur XML files add karte ho
[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/xml"

# Robots.txt ke liye header change ki zarurat nahi (text/plain is fine)
