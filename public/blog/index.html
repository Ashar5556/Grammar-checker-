<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammarify Blog - English Learning Tips</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f7fa; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        .header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white; padding: 50px 0; text-align: center; margin-bottom: 40px;
        }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        
        .categories {
            display: flex; justify-content: center; gap: 10px; 
            margin-bottom: 30px; flex-wrap: wrap;
        }
        .cat-btn {
            padding: 8px 16px; background: white; border: 2px solid #ddd;
            border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        .cat-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }
        
        .blog-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px; margin-bottom: 40px;
        }
        .blog-card {
            background: white; border-radius: 10px; overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1); transition: transform 0.3s;
        }
        .blog-card:hover { transform: translateY(-5px); }
        
        .blog-img { width: 100%; height: 200px; object-fit: cover; }
        .blog-content { padding: 20px; }
        .blog-cat {
            display: inline-block; background: #eef2ff; color: #4f46e5;
            padding: 4px 10px; border-radius: 15px; font-size: 0.8rem;
            font-weight: bold; margin-bottom: 10px;
        }
        .blog-title { 
            font-size: 1.3rem; margin-bottom: 10px; color: #1f2937;
            line-height: 1.4;
        }
        .blog-title a { color: inherit; text-decoration: none; }
        .blog-title a:hover { color: #4f46e5; }
        
        .blog-desc { color: #666; margin-bottom: 15px; line-height: 1.5; }
        .blog-meta { 
            display: flex; justify-content: space-between; 
            color: #888; font-size: 0.85rem; border-top: 1px solid #eee;
            padding-top: 15px; margin-top: 15px;
        }
        .read-more { 
            color: #4f46e5; text-decoration: none; font-weight: bold;
            display: inline-block; margin-top: 10px;
        }
        
        .load-more { text-align: center; margin: 40px 0; }
        #loadBtn {
            background: #4f46e5; color: white; border: none;
            padding: 12px 30px; border-radius: 5px; cursor: pointer;
            font-size: 1rem; font-weight: bold;
        }
        #loadBtn:hover { background: #3730a3; }
        #loadBtn:disabled { background: #999; cursor: not-allowed; }
        
        @media (max-width: 768px) {
            .blog-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>📚 Grammarify Blog</h1>
            <p>English grammar, vocabulary and writing tips</p>
        </div>
    </header>
    
    <main class="container">
        <div class="categories" id="catContainer"></div>
        
        <div class="blog-grid" id="blogContainer">
            <p>Loading blogs...</p>
        </div>
        
        <div class="load-more">
            <button id="loadBtn">Load More Blogs</button>
        </div>
    </main>

    <script>
        // Simple version - no pagination
        async function loadBlogs() {
            try {
                const response = await fetch("/blog/posts.json")
;
                const blogs = await response.json();
                
                // Sort by date (newest first)
                blogs.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                displayBlogs(blogs);
                setupCategories(blogs);
                
            } catch (error) {
                document.getElementById('blogContainer').innerHTML = 
                    '<p style="color:red; text-align:center;">Error loading blogs. Check posts.json file.</p>';
            }
        }
        
        function displayBlogs(blogs) {
            const container = document.getElementById('blogContainer');
            
            if (blogs.length === 0) {
                container.innerHTML = '<p>No blogs found.</p>';
                return;
            }
            
            container.innerHTML = blogs.map(blog => `
                <div class="blog-card">
                    ${blog.image ? `
                        <img src="${blog.image}" alt="${blog.title}" class="blog-img">
                    ` : `<div style="height:200px; background:#eee;"></div>`}
                    
                    <div class="blog-content">
                        <span class="blog-cat">${blog.category || 'General'}</span>
                        <h3 class="blog-title">
                            <a href="${blog.url}">${blog.title}</a>
                        </h3>
                        <p class="blog-desc">${blog.description}</p>
                        
                        <div class="blog-meta">
                            <span>📅 ${formatDate(blog.date)}</span>
                            ${blog.readTime ? `<span>⏱️ ${blog.readTime}</span>` : ''}
                        </div>
                        
                        <a href="${blog.url}" class="read-more">Read Article →</a>
                    </div>
                </div>
            `).join('');
            
            // Hide load more button since we're showing all
            document.getElementById('loadBtn').style.display = 'none';
        }
        
        function setupCategories(blogs) {
            const categories = ['All'];
            blogs.forEach(blog => {
                if (blog.category && !categories.includes(blog.category)) {
                    categories.push(blog.category);
                }
            });
            
            const catContainer = document.getElementById('catContainer');
            catContainer.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === 'All' ? 'active' : ''}" 
                        onclick="filterByCategory('${cat}')">
                    ${cat}
                </button>
            `).join('');
        }
        
        function filterByCategory(category) {
            // Update active button
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === category) btn.classList.add('active');
            });
            
            // Load all blogs and filter
            fetch("/blog/posts.json")

                .then(res => res.json())
                .then(blogs => {
                    if (category === 'All') {
                        displayBlogs(blogs);
                    } else {
                        const filtered = blogs.filter(blog => blog.category === category);
                        displayBlogs(filtered);
                    }
                });
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-IN', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });
        }
        
        // Load blogs on page load
        document.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
</body>
</html>
